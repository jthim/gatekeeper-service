<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise ADMIN Security Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"
            integrity="sha256-eTPiE7OfNDSwTrJNIZ8nlZapx9n3gz9+Oo2zzr5+adM=" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center font-sans">
<div class="max-w-md w-full bg-slate-900 border border-emerald-500/30 p-8 rounded-2xl shadow-xl text-center space-y-6">
    <div class="inline-flex p-3 bg-emerald-500/10 text-emerald-400 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-white">ADMIN Secure Session Established</h1>
    <p class="text-sm text-slate-400">
        Welcome to the protected enclave. This view is cryptographically secured via your enterprise identity assertion
        tokens.
    </p>
    <div class="bg-slate-950/50 rounded-lg p-4 text-left border border-slate-800">
        <span class="text-xs font-mono text-emerald-400 font-semibold uppercase tracking-wider block mb-1"
              th:text="|Welcome, ${userFullName}|">Welcome, User</span>
        <code class="text-xs font-mono text-slate-300">Principal: Authenticated_ADMIN_User</code>
    </div>

    <form th:action="@{/logout}" method="post" class="pt-2">
        <button type="submit"
                class="w-full bg-slate-800 hover:bg-red-950/40 border border-slate-700 hover:border-red-500/40 text-slate-300 hover:text-red-400 font-medium py-2.5 px-4 rounded-xl transition duration-200 text-sm cursor-pointer shadow-sm">
            Sign Out of Enterprise Session
        </button>
    </form>
</div>
</body>
</html>
