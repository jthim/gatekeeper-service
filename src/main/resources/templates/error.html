<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Denied - Gatekeeper</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex min-h-screen flex-col items-center justify-center p-6 font-sans">

<div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl border border-slate-100">
  <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-50 text-red-600 mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-8 w-8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
    </svg>
  </div>

  <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Access Denied</h1>
  <p class="text-slate-500 text-sm mb-6">
    This is the general error page. An error has occurred. Please contact your security administrator for further assistance.
  </p>

  <div class="space-y-3">
    <a th:href="@{/}"
       class="block w-full rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow hover:bg-slate-800 transition duration-150">
      Return to Landing Page
    </a>
  </div>
</div>

<div class="mt-8 text-center text-xs text-slate-400">
  System Identifier: <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">Gatekeeper-Service</span>
</div>

</body>
</html>
